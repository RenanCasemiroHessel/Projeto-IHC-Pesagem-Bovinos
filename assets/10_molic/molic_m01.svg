  <rect class="ub" x="750" y="966" width="16" height="12" rx="3"/><text class="d" x="774" y="978">acesso ubíquo</text>
  <text class="d" x="750" y="999">u: fala do usuário</text>
  <text class="d" x="750" y="1018">d: fala do preposto</text>
  <text class="d" x="750" y="1037">[?] ainda não decidido</text>
