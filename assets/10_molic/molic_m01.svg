  <text class="n" x="452" y="30">abertura</text>
  <text class="n" x="412" y="1135" text-anchor="end">encerramento</text>
  <rect class="pill" x="310" y="55" width="240" height="34" rx="17"/><text class="d" x="430" y="77" text-anchor="middle" style="font-weight:bold">gco: Pesar um animal por foto</text>
  <rect class="pill" x="310" y="1055" width="240" height="34" rx="17"/><text class="d" x="430" y="1077" text-anchor="middle" style="font-weight:bold">gcc: Pesar um animal por foto</text>
  <rect class="ub" x="640" y="25" width="340" height="64" rx="12"/>
  <text class="t" x="810" y="47" text-anchor="middle">Acesso ubíquo [H]</text>
  <text class="d" x="810" y="67" text-anchor="middle">u: desistir da pesagem (em qualquer cena)</text>
  <text class="d" x="810" y="82" text-anchor="middle">nada é salvo</text>
  <rect class="sc" x="310" y="125" width="240" height="100" rx="12"/>
  <text class="t" x="430.0" y="149" text-anchor="middle">Fotografar o animal</text>
  <text class="d" x="430.0" y="171" text-anchor="middle">enquadrar o animal inteiro</text>
  <text class="d" x="430.0" y="189" text-anchor="middle">escolher macho ou fêmea</text>
  <text class="d" x="430.0" y="207" text-anchor="middle">tocar em “Estimar peso”</text>
  <rect class="sc" x="310" y="335" width="240" height="90" rx="12"/>
  <text class="t" x="430.0" y="359" text-anchor="middle">Ler o peso estimado</text>
  <text class="d" x="430.0" y="381" text-anchor="middle">ver o peso em kg e em @</text>
  <text class="d" x="430.0" y="399" text-anchor="middle">ver a margem de erro (~20 kg)</text>
  <rect class="sc" x="310" y="485" width="240" height="100" rx="12"/>
  <text class="t" x="430.0" y="509" text-anchor="middle">Identificar o animal</text>
  <text class="d" x="430.0" y="531" text-anchor="middle">digitar o número do brinco</text>
  <text class="d" x="430.0" y="549" text-anchor="middle">ou escolher o animal no lote</text>
  <text class="d" x="430.0" y="567" text-anchor="middle">(com a foto da última pesagem)</text>
  <rect class="sc" x="310" y="700" width="240" height="110" rx="12"/>
  <text class="t" x="430.0" y="724" text-anchor="middle">Conferir antes de salvar</text>
  <text class="d" x="430.0" y="746" text-anchor="middle">ver brinco e foto bem grandes</text>
  <text class="d" x="430.0" y="764" text-anchor="middle">comparar com o animal à frente</text>
  <text class="d" x="430.0" y="782" text-anchor="middle">decidir se salva</text>
  <rect class="sc" x="310" y="930" width="240" height="80" rx="12"/>
  <text class="t" x="430.0" y="954" text-anchor="middle">Peso salvo</text>
  <text class="d" x="430.0" y="976" text-anchor="middle">ver em qual animal ficou:</text>
  <text class="d" x="430.0" y="994" text-anchor="middle">boi, lote e data</text>
  <rect class="sc" x="730" y="720" width="250" height="70" rx="12"/>
  <text class="t" x="855.0" y="744" text-anchor="middle">Informar animal novo [?]</text>
  <text class="d" x="855.0" y="766" text-anchor="middle">informar os dados do animal [?]</text>
  <rect class="al" x="730" y="240" width="250" height="76" rx="12"/>
  <text class="t" x="855.0" y="264" text-anchor="middle">Boi não reconhecido</text>
  <text class="d" x="855.0" y="286" text-anchor="middle">não mostra peso nem deixa salvar;</text>
  <text class="d" x="855.0" y="304" text-anchor="middle">pede outra foto</text>
  <rect class="al" x="730" y="595" width="250" height="80" rx="12"/>
  <text class="t" x="855.0" y="619" text-anchor="middle">Nenhum bovino encontrado</text>
  <text class="d" x="855.0" y="641" text-anchor="middle">não achou esse número;</text>
  <text class="d" x="855.0" y="659" text-anchor="middle">oferece corrigir, lote ou animal novo</text>
  <rect class="pr" x="330" y="270" width="200" height="14"/>
  <text class="d" x="322" y="274" text-anchor="end">mostra “calculando...”</text>
  <text class="d" x="322" y="289" text-anchor="end">e estima o peso pela foto</text>
  <rect class="pr" x="330" y="625" width="200" height="14"/>
  <text class="d" x="322" y="629" text-anchor="end">procura o animal</text>
  <text class="d" x="322" y="644" text-anchor="end">no cadastro</text>
  <rect class="pr" x="330" y="860" width="200" height="14"/>
  <text class="d" x="322" y="864" text-anchor="end">grava o peso</text>
  <text class="d" x="322" y="879" text-anchor="end">no animal</text>
  <text class="h" x="440" y="110" text-anchor="start">d: tire uma foto do boi, de lado e inteiro</text><text class="l" x="440" y="110" text-anchor="start">d: tire uma foto do boi, de lado e inteiro</text>
  <text class="h" x="440" y="252" text-anchor="start">u: toca em “Estimar peso”</text><text class="l" x="440" y="252" text-anchor="start">u: toca em “Estimar peso”</text>
  <text class="h" x="630" y="269" text-anchor="middle">d: não reconhecemos o boi</text><text class="l" x="630" y="269" text-anchor="middle">d: não reconhecemos o boi</text>
  <text class="h" x="700" y="167" text-anchor="middle">u: tirar outra foto</text><text class="l" x="700" y="167" text-anchor="middle">u: tirar outra foto</text>
  <text class="h" x="440" y="313" text-anchor="start">d: peso estimado</text><text class="l" x="440" y="313" text-anchor="start">d: peso estimado</text>
  <text class="h" x="440" y="460" text-anchor="start">u: guardar este peso</text><text class="l" x="440" y="460" text-anchor="start">u: guardar este peso</text>
  <text class="h" x="440" y="608" text-anchor="start">u: é o 117 (digita o número)</text><text class="l" x="440" y="608" text-anchor="start">u: é o 117 (digita o número)</text>
  <text class="h" x="630" y="624" text-anchor="middle">d: nenhum bovino com esse nº</text><text class="l" x="630" y="624" text-anchor="middle">d: nenhum bovino com esse nº</text>
  <text class="h" x="700" y="527" text-anchor="middle">u: corrigir o número ou procurar pelo lote</text><text class="l" x="700" y="527" text-anchor="middle">u: corrigir o número ou procurar pelo lote</text>
  <text class="h" x="845" y="702" text-anchor="end">u: informar como animal novo</text><text class="l" x="845" y="702" text-anchor="end">u: informar como animal novo</text>
  <text class="h" x="640" y="749" text-anchor="middle">u: confirmar os dados [?]</text><text class="l" x="640" y="749" text-anchor="middle">u: confirmar os dados [?]</text>
  <text class="h" x="440" y="675" text-anchor="start">d: encontrei o 117, lote Pasto 2</text><text class="l" x="440" y="675" text-anchor="start">d: encontrei o 117, lote Pasto 2</text>
  <text class="h" x="175" y="749" text-anchor="middle">u: não é esse (o peso fica guardado)</text><text class="l" x="175" y="749" text-anchor="middle">u: não é esse (o peso fica guardado)</text>
  <text class="h" x="440" y="840" text-anchor="start">u: compara e toca em salvar</text><text class="l" x="440" y="840" text-anchor="start">u: compara e toca em salvar</text>
  <text class="h" x="440" y="906" text-anchor="start">d: peso salvo no boi 117</text><text class="l" x="440" y="906" text-anchor="start">d: peso salvo no boi 117</text>
  <text class="h" x="160" y="962" text-anchor="middle">u: agora o próximo (câmera pronta)</text><text class="l" x="160" y="962" text-anchor="middle">u: agora o próximo (câmera pronta)</text>
  <text class="h" x="440" y="1038" text-anchor="start">u: terminar de pesar</text><text class="l" x="440" y="1038" text-anchor="start">u: terminar de pesar</text>
