  <rect class="sc" x="750" y="882" width="16" height="12" rx="3"/><text class="d" x="774" y="894">cena (tópico da conversa)</text>
  <rect class="al" x="750" y="903" width="16" height="12" rx="3"/><text class="d" x="774" y="915">cena de alerta (ruptura)</text>
